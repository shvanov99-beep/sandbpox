<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Зелёный треугольник</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
  }
  canvas {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  ctx.beginPath();
  ctx.moveTo(200, 50);
  ctx.lineTo(50, 350);
  ctx.lineTo(350, 350);
  ctx.closePath();

  ctx.fillStyle = '#2ecc40';
  ctx.fill();
</script>
</body>
</html>
